      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            tajawal: ['Tajawal', 'sans-serif'],
          },
          colors: {
            nabta: {
              teal: '#0D9488',
              tealLight: '#14B8A6',
              gold: '#F59E0B',
              goldLight: '#FACC15',
              sky: '#0EA5E9',
              skyLight: '#38BDF8',

  <style>
    :root {
      --teal-main: #0D9488;
      --teal-soft: #14B8A6;
      --gold-main: #F59E0B;
      --gold-soft: #FACC15;
      --sky-main: #0EA5E9;
      --purple-main: #8B5CF6;
      --bg-canvas: #F8FAFC;
    }

    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background-color: var(--bg-canvas);
      color: #1E293B;
      overflow-x: hidden;
    }

    .font-story {
      font-family: 'Tajawal', 'Cairo', sans-serif;
    }

    .btn-tactile {
      transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.2s ease;
      box-shadow: 0 4px 0 rgba(15, 23, 42, 0.16);
    }

    .btn-tactile:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(15, 23, 42, 0.16);
    }

    .btn-tactile:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.16);
    }

    .btn-teal {
      box-shadow: 0 4px 0 #0F766E;
    }
    .btn-teal:active {
      box-shadow: 0 1px 0 #0F766E;
    }

    .btn-gold {
      box-shadow: 0 4px 0 #B45309;
    }
    .btn-gold:active {
      box-shadow: 0 1px 0 #B45309;
    }

    .btn-sky {
      box-shadow: 0 4px 0 #0369A1;
    }
    .btn-sky:active {
      box-shadow: 0 1px 0 #0369A1;
    }

    .btn-purple {
      box-shadow: 0 4px 0 #6D28D9;
    }
    .btn-purple:active {
      box-shadow: 0 1px 0 #6D28D9;
    }

    @keyframes sproutFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes pulseStar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-sprout {
      animation: sproutFloat 3.6s ease-in-out infinite;
    }

    .animate-star {
      animation: pulseStar 2.4s ease-in-out infinite;
    }

    .animate-pop {
      animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .card-lift {
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .card-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px -8px rgba(15, 23, 42, 0.12);
    }

    .hero-pattern {
      background-color: #FFFFFF;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(20, 184, 166, 0.12) 0%, transparent 32%),
        radial-gradient(circle at 88% 15%, rgba(250, 204, 21, 0.16) 0%, transparent 34%),
        radial-gradient(circle at 80% 82%, rgba(56, 189, 248, 0.12) 0%, transparent 32%),
        radial-gradient(circle at 18% 85%, rgba(196, 181, 253, 0.18) 0%, transparent 32%);
    }

    .memory-card {
      perspective: 800px;
    }

    .memory-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .memory-card.flipped .memory-inner,
    .memory-card.matched .memory-inner {
      transform: rotateY(180deg);
    }

    .memory-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .memory-back {
      transform: rotateY(180deg);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.nabtaCloud = {
      ready: false,
      db: null,
      auth: null,
      user: null,
      appId: typeof __app_id !== 'undefined' ? __app_id : 'nabta-edu-platform',
      async init() {
        try {
          if (typeof __firebase_config === 'undefined') return;
          const config = JSON.parse(__firebase_config);
          const app = initializeApp(config);
          this.auth = getAuth(app);
          this.db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(this.auth, __initial_auth_token);
          } else {
            await signInAnonymously(this.auth);
          }

          this.user = this.auth.currentUser;
          if (!this.user) return;
          this.ready = true;

          const stateRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'nabta_platform', 'state_v1');
          onSnapshot(stateRef, (snap) => {
            if (snap.exists() && window.applyCloudSnapshot) {
              window.applyCloudSnapshot(snap.data());
            }
          }, (err) => {
            console.warn('Cloud sync listener notice:', err.message);
          });
        } catch (err) {
          console.warn('Running in standalone session mode:', err.message);
        }
      },
      async pushState(serializedState) {
        if (!this.ready || !this.user || !this.db) return;
        try {
          const stateRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'nabta_platform', 'state_v1');
          await setDoc(stateRef, {
            payload: JSON.stringify(serializedState),
            updatedAt: Date.now()
          }, { merge: true });
        } catch (err) {
          console.warn('Cloud save skipped:', err.message);
        }
      }
    };

    window.nabtaCloud.init();
  </script>

    function persistState() {
      syncLeaderboardWithStudents();
      if (window.nabtaCloud && window.nabtaCloud.ready) {
        window.nabtaCloud.pushState(nabtaState);
      }
      refreshHeaderBar();

    window.applyCloudSnapshot = function(cloudDoc) {
      if (!cloudDoc || !cloudDoc.payload) return;
      try {
        const parsed = JSON.parse(cloudDoc.payload);
        if (parsed && parsed.students && parsed.curriculumTracks) {
          nabtaState = parsed;
          refreshHeaderBar();
          renderCurrentRoute();
        }
      } catch (e) {
        console.warn('Snapshot parse ignored');
      }
    };

    function syncLeaderboardWithStudents() {
      nabtaState.students.forEach(stu => {
        const existing = nabtaState.leaderboard.find(item => item.name === stu.name);
        if (existing) {
          existing.points = stu.points;
          existing.avatar = stu.avatar;
          existing.badge = stu.badges[stu.badges.length - 1] || 'بطل نبتة';
        } else {
          nabtaState.leaderboard.push({
            name: stu.name,
            points: stu.points,
            avatar: stu.avatar,
            badge: stu.badges[0] || 'مكتشف جديد'
          });
        }
      });
      nabtaState.leaderboard.sort((a, b) => b.points - a.points);
    }

    function getActiveStudent() {
      return nabtaState.students.find(s => s.id === nabtaState.activeStudentId) || nabtaState.students[0];
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const colors = {
        success: 'bg-teal-700 text-white border-teal-500',
        gold: 'bg-amber-500 text-slate-950 border-amber-300',
        info: 'bg-sky-700 text-white border-sky-500',
        error: 'bg-rose-600 text-white border-rose-400'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-lg font-bold text-sm flex items-center gap-2 animate-pop ${colors[type] || colors.success}`;
      el.innerHTML = `<span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3400);
    }

    function speakEnglishText(text) {
      if (!('speechSynthesis' in window)) {
        showToast('متصفحك لا يدعم النطق الصوتي الآلي', 'info');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      utterance.pitch = 1.08;
      window.speechSynthesis.speak(utterance);
      showToast(`🔊 جاري نطق: "${text}"`, 'info');
    }

    function calculateStudentProgress(student) {
      let totalLevels = 0;
      Object.values(nabtaState.curriculumTracks).forEach(track => {
        totalLevels += track.levels.length;
      });
      if (totalLevels === 0) return 0;
      const done = student.completedLevels.length;
      return Math.min(100, Math.round((done / totalLevels) * 100));
    }

    function renderSubjectsView() {
      const student = getActiveStudent();
      const tracks = Object.values(nabtaState.curriculumTracks);
      const activeTrack = nabtaState.curriculumTracks[selectedSubjectId] || tracks[0];

      if (selectedLevelId) {
        const levelIndex = activeTrack.levels.findIndex(l => l.id === selectedLevelId);
        const level = activeTrack.levels[levelIndex];
        if (level) {
          return renderLevelWorkspace(activeTrack, level, levelIndex);
        }
      }

      const subjectHomework = nabtaState.assignmentsList.filter(hw => hw.subjectId === activeTrack.id);

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          <div class="flex flex-wrap gap-3">
            ${tracks.map(t => {
              const isSelected = t.id === activeTrack.id;
              return `
                <button onclick="selectedSubjectId='${t.id}'; selectedLevelId=null; renderCurrentRoute();"
                  class="px-5 py-3.5 rounded-2xl font-black text-sm sm:text-base flex items-center gap-2.5 transition-all ${isSelected ? `bg-gradient-to-l ${t.headerGrad} text-white shadow-lg scale-[1.02]` : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}">
                  <span class="text-xl">${t.icon}</span>
                  <span>${t.title}</span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="rounded-3xl p-6 sm:p-8 bg-gradient-to-l ${activeTrack.headerGrad} text-white shadow-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
            <div class="space-y-2">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/20 text-xs font-extrabold">
                <span>${activeTrack.icon}</span>
                <span>منهج تفاعلي متدرج</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-black">${activeTrack.title}</h1>
              <p class="text-white/90 font-story text-base max-w-2xl">${activeTrack.subtitle}</p>
            </div>
            <div class="bg-white/15 backdrop-blur-sm rounded-2xl p-4 text-center shrink-0">
              <div class="text-xs font-bold text-white/90">مكافأة إتمام كل مستوى</div>
              <div class="text-2xl font-black mt-1">+5 نقاط ⭐</div>
            </div>
          </div>

          <div class="space-y-4">
            <h2 class="text-xl font-black text-slate-900">خارطة المستويات التعليمية</h2>
            <div class="grid md:grid-cols-2 gap-6">
              ${activeTrack.levels.map((lvl, idx) => {
                const isCompleted = student.completedLevels.includes(lvl.id);
                const prevLevel = idx > 0 ? activeTrack.levels[idx - 1] : null;
                const isUnlocked = idx === 0 || isCompleted || (prevLevel && student.completedLevels.includes(prevLevel.id));

                return `
                  <div class="bg-white rounded-3xl p-6 border-2 ${isCompleted ? 'border-teal-400' : isUnlocked ? 'border-amber-300' : 'border-slate-200 opacity-75'} shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="px-3 py-1 rounded-full text-xs font-extrabold ${isCompleted ? 'bg-teal-100 text-teal-800' : isUnlocked ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'}">
                          ${isCompleted ? '✅ مكتمل (+5 نقاط)' : isUnlocked ? '🔓 متاح الآن' : '🔒 مغلق (أكمل المستوى السابق)'}
                        </span>
                        <span class="text-xs font-bold text-slate-500">${lvl.lessons.length} دروس + اختبار</span>
                      </div>
                      <h3 class="text-xl font-black text-slate-900 mb-2">${lvl.title}</h3>
                      <p class="text-sm text-slate-600 font-story mb-4">${lvl.description}</p>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                      <div class="text-xs font-bold text-slate-500">
                        الاختبار: ${lvl.quiz.length} أسئلة تفاعلية
                      </div>
                      ${isUnlocked
                        ? `<button onclick="selectedLevelId='${lvl.id}'; renderCurrentRoute();" class="btn-tactile btn-teal px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-sm">
                            ${isCompleted ? 'مراجعة المستوى' : 'ابدأ المستوى 🚀'}
                          </button>`
                        : `<button disabled class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-400 font-extrabold text-sm cursor-not-allowed">
                            مغلق حالياً 🔒
                          </button>`
                      }
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-black text-slate-900">📝 الواجبات والتدريبات المنزلية للقسم</h3>
              <span class="text-xs font-extrabold text-amber-700 bg-amber-50 px-3 py-1 rounded-full">+3 نقاط لكل واجب</span>
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              ${subjectHomework.map(hw => {
                const done = student.completedHomework.includes(hw.id);
                return `
                  <div class="p-4 rounded-2xl border ${done ? 'bg-teal-50/60 border-teal-200' : 'bg-slate-50 border-slate-200'} flex items-center justify-between gap-4">
                    <div>
                      <h4 class="font-extrabold text-slate-900 text-sm">${hw.title}</h4>
                      <p class="text-xs text-slate-600 mt-1">${hw.desc}</p>
                    </div>
                    ${done
                      ? `<span class="px-3 py-1.5 rounded-xl bg-teal-600 text-white text-xs font-extrabold shrink-0">تم التسليم ✓</span>`
                      : `<button onclick="completeHomeworkTask('${hw.id}')" class="btn-tactile btn-gold px-4 py-2 rounded-xl bg-amber-400 text-slate-950 text-xs font-black shrink-0">إتمام الواجب</button>`
                    }
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function completeHomeworkTask(hwId) {
      const student = getActiveStudent();
      const hw = nabtaState.assignmentsList.find(h => h.id === hwId);
      if (!hw || student.completedHomework.includes(hwId)) return;
      student.completedHomework.push(hwId);
      student.points += hw.points;
      student.stars += 1;
      student.achievementsLog.unshift({
        title: `إتمام واجب: ${hw.title}`,
        points: hw.points,
        date: new Date().toISOString().slice(0, 10)
      });
      persistState();
      showToast(`أحسنت! تم تسليم الواجب وحصلت على +${hw.points} نقاط ⭐`, 'success');
      renderCurrentRoute();
    }

    function renderLevelWorkspace(track, level, levelIndex) {
      const student = getActiveStudent();
      const isCompleted = student.completedLevels.includes(level.id);

      return `
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          <div class="flex items-center justify-between gap-4">
            <button onclick="selectedLevelId=null; renderCurrentRoute();" class="px-4 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 font-extrabold text-sm text-slate-700 flex items-center gap-2">
              <span>→</span>
              <span>العودة إلى ${track.title}</span>
            </button>
            <span class="px-3.5 py-1.5 rounded-full text-xs font-extrabold ${track.badgeBg}">
              ${isCompleted ? '✅ مستوى مكتمل' : '🎯 قيد التعلم'}
            </span>
          </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-slate-100 shadow-sm space-y-6">
            <div>
              <h1 class="text-2xl sm:text-3xl font-black text-slate-900">${level.title}</h1>
              <p class="text-slate-600 font-story mt-1">${level.description}</p>
            </div>

            <div class="space-y-6">
              ${level.lessons.map((lesson, idx) => renderInteractiveLessonCard(lesson, idx)).join('')}
            </div>
          </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-amber-200 shadow-md space-y-6">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div>
                <span class="text-xs font-extrabold text-amber-700 bg-amber-100 px-3 py-1 rounded-full">اختبار نهاية المستوى</span>
                <h2 class="text-xl sm:text-2xl font-black text-slate-900 mt-2">أجب عن الأسئلة للحصول على 5 نقاط ⭐</h2>
              </div>
            </div>

            <form id="levelQuizForm" onsubmit="submitLevelQuiz(event, '${track.id}', '${level.id}')" class="space-y-5">
              ${level.quiz.map((item, qIdx) => `
                <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                  <p class="font-black text-slate-900 text-base">${qIdx + 1}. ${item.q}</p>
                  <div class="grid sm:grid-cols-3 gap-2.5">
                    ${item.options.map((opt, oIdx) => `
                      <label class="cursor-pointer flex items-center gap-2.5 p-3 rounded-xl bg-white border border-slate-200 hover:border-teal-400 font-bold text-sm text-slate-800">
                        <input type="radio" name="q_${qIdx}" value="${oIdx}" required class="w-4 h-4 accent-teal-600" />
                        <span>${opt}</span>
                      </label>
                    `).join('')}
                  </div>
                </div>
              `).join('')}

              <div class="flex justify-end">
                <button type="submit" class="btn-tactile btn-teal px-8 py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-black text-base">
                  تصحيح الإجابات واستلام المكافأة 🏆
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderInteractiveLessonCard(lesson, idx) {
      let interactiveHtml = '';

      if (lesson.interactiveType === 'arabic_letters' && lesson.letters) {
        interactiveHtml = `
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">
            ${lesson.letters.map(l => `
              <div class="p-4 rounded-2xl bg-teal-50/70 border border-teal-200 text-center space-y-1.5">
                <div class="text-3xl font-black text-teal-700">${l.char}</div>
                <div class="text-xs font-extrabold text-slate-800 bg-white rounded-lg py-1 px-2">${l.fatha}</div>
                <div class="text-xs font-extrabold text-slate-800 bg-white rounded-lg py-1 px-2">${l.damma}</div>
                <div class="text-xs font-extrabold text-slate-800 bg-white rounded-lg py-1 px-2">${l.kasra}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (lesson.interactiveType === 'word_builder' && lesson.words) {
        interactiveHtml = `
          <div class="grid sm:grid-cols-3 gap-3 mt-4">
            ${lesson.words.map(w => `
              <div class="p-4 rounded-2xl bg-amber-50/70 border border-amber-200 text-center space-y-2">
                <div class="flex justify-center gap-1.5" dir="rtl">
                  ${w.parts.map(p => `<span class="px-2.5 py-1 rounded-lg bg-white border border-amber-300 font-black text-amber-800">${p}</span>`).join('')}
                </div>
                <div class="text-xl font-black text-slate-900">= ${w.full}</div>
                <p class="text-xs text-slate-600 font-semibold">${w.meaning}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (lesson.interactiveType === 'english_speech' && lesson.items) {
        interactiveHtml = `
          <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3 mt-4">
            ${lesson.items.map(item => `
              <button type="button" onclick="speakEnglishText('${item.speak.replace(/'/g, "\\'")}')"
                class="p-4 rounded-2xl bg-sky-50 hover:bg-sky-100 border-2 border-sky-200 text-right transition-all flex items-center justify-between gap-3 group">
                <div>
                  <div class="text-2xl mb-1">${item.emoji}</div>
                  <div class="font-black text-sky-900 text-base" dir="ltr">${item.word}</div>
                  <div class="text-xs font-bold text-slate-600">${item.ar}</div>
                </div>
                <span class="w-10 h-10 rounded-full bg-sky-600 text-white flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">🔊</span>
              </button>
            `).join('')}
          </div>
        `;
      } else if (lesson.interactiveType === 'math_shapes' && lesson.shapes) {
        interactiveHtml = `
          <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-3 mt-4">
            ${lesson.shapes.map(sh => `
              <div class="p-4 rounded-2xl bg-amber-50/60 border border-amber-200 text-center space-y-2">
                ${svgArtwork.shapeSvg(sh.key)}

            <span class="text-2xl font-black text-slate-700">=</span>

          </div>

          <p class="text-sm text-slate-600 font-story leading-relaxed">${lesson.summary}</p>
          ${interactiveHtml}
        </div>
      `;

    function updateMathSandbox() {
      const a = Number(document.getElementById('mathBoxA')?.value || 0);
      const b = Number(document.getElementById('mathBoxB')?.value || 0);
      const op = document.getElementById('mathBoxOp')?.value || '+';
      let res = a + b;
      if (op === '-') res = a - b;
      if (op === '*') res = a * b;
      const target = document.getElementById('mathBoxRes');
      if (target) target.textContent = res;
    }

    function submitLevelQuiz(e, trackId, levelId) {
      e.preventDefault();
      const track = nabtaState.curriculumTracks[trackId];
      const level = track.levels.find(l => l.id === levelId);
      const formData = new FormData(e.target);

      let score = 0;
      level.quiz.forEach((q, idx) => {
        if (Number(formData.get(`q_${idx}`)) === q.answer) {
          score++;
        }
      });

      const passThreshold = Math.ceil(level.quiz.length * 0.6);
      if (score >= passThreshold) {
        const student = getActiveStudent();
        const alreadyCompleted = student.completedLevels.includes(level.id);
        if (!alreadyCompleted) {
          student.completedLevels.push(level.id);
        }
        triggerLevelCelebration(level.title, alreadyCompleted);
      } else {
        showToast(`حصلت على ${score} من ${level.quiz.length}. حاول مرة أخرى للنجاح في المستوى! 💪`, 'gold');
      }
    }

    function launchEducationalGame(gameId) {

    function generateMathChallenge() {
      const a = Math.floor(Math.random() * 12) + 2;
      const b = Math.floor(Math.random() * 10) + 1;
      const isAdd = Math.random() > 0.35;
      const ans = isAdd ? a + b : a * b;
      const opText = isAdd ? `${a} + ${b}` : `${a} × ${b}`;
      const choices = new Set([ans, ans + 2, Math.max(1, ans - 1)]);
      while (choices.size < 3) choices.add(ans + Math.floor(Math.random() * 7) + 1);
      return {
        question: opText,
        answer: ans,
        options: Array.from(choices).sort(() => Math.random() - 0.5)
      };
    }

          <div class="text-center space-y-6">

            </div>
          </div>
        `;
      } else if (gameId === 'g-memory') {
        bodyHtml = `
          <div class="space-y-5">
            <div class="flex justify-between items-center text-sm font-extrabold">
              <span class="text-slate-600">طابق كل صورة مع كلمتها الصحيحة</span>
              <span class="px-3 py-1 rounded-full bg-purple-100 text-purple-800">المحاولات: ${gameRuntime.moves}</span>
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
              ${gameRuntime.cards.map(c => `
                <button onclick="flipMemoryCard(${c.uid})" class="memory-card h-24 sm:h-28 ${c.flipped || c.matched ? 'flipped' : ''} ${c.matched ? 'matched' : ''}">
                  <div class="memory-inner">
                    <div class="memory-face bg-gradient-to-br from-purple-600 to-indigo-600 text-white font-black text-2xl shadow-sm">

    function pickUnscrambleLetter(id) {
      const item = gameRuntime.pool.find(p => p.id === id);
      if (!item || gameRuntime.picked.length >= gameRuntime.target.length) return;
      gameRuntime.picked.push(item);
      const built = gameRuntime.picked.map(p => p.ch).join('');
      if (built === gameRuntime.target) {
        awardGameVictory('لعبة ترتيب الحروف', 2);
      }
      renderCurrentRoute();
    }

    function verifyBuiltWord() {
      const word = gameRuntime.currentWord.trim();
      if (!word) return;
      if (gameRuntime.validWords.includes(word) && !gameRuntime.found.includes(word)) {
        gameRuntime.found.push(word);
        gameRuntime.currentWord = '';
        awardGameVictory('لعبة تكوين الكلمات', 2);
      } else if (gameRuntime.found.includes(word)) {
        showToast('لقد كوّنت هذه الكلمة بالفعل!', 'info');
        gameRuntime.currentWord = '';
      } else {
        showToast('جرّب تكوين كلمة أخرى مثل: قلم، درس، قلب، مدرسة', 'gold');
        gameRuntime.currentWord = '';
      }
      renderCurrentRoute();
    }

    function answerMathGame(chosen) {
      if (chosen === gameRuntime.answer) {
        gameRuntime.score++;
        showToast('إجابة صحيحة! أحسنت 🎯', 'success');
      } else {
        showToast(`الإجابة الصحيحة كانت ${gameRuntime.answer}`, 'info');
      }
      if (gameRuntime.round < gameRuntime.totalRounds) {
        gameRuntime.round++;
        Object.assign(gameRuntime, generateMathChallenge());
        renderCurrentRoute();
      } else {
        if (gameRuntime.score >= 3) {
          awardGameVictory('لعبة العمليات الحسابية', 2);
        }
        activeGameId = null;
        renderCurrentRoute();
      }
    }

    function flipMemoryCard(uid) {
      const card = gameRuntime.cards.find(c => c.uid === uid);
      if (!card || card.flipped || card.matched || gameRuntime.selectedUids.length >= 2) return;
      card.flipped = true;
      gameRuntime.selectedUids.push(uid);
      renderCurrentRoute();

      if (gameRuntime.selectedUids.length === 2) {
        gameRuntime.moves++;
        const [firstId, secondId] = gameRuntime.selectedUids;
        const c1 = gameRuntime.cards.find(c => c.uid === firstId);
        const c2 = gameRuntime.cards.find(c => c.uid === secondId);
        if (c1.pairId === c2.pairId) {
          c1.matched = true;
          c2.matched = true;
          gameRuntime.selectedUids = [];
          if (gameRuntime.cards.every(c => c.matched)) {
            awardGameVictory('لعبة الذاكرة', 3);
          }
          renderCurrentRoute();
        } else {
          setTimeout(() => {

            c2.flipped = false;

            renderCurrentRoute();
          }, 750);
        }
      }
    }

    function answerQuizGame(val) {
      const item = gameRuntime.items[gameRuntime.idx];
      const correct = val === item.answer;
      if (correct) {
        gameRuntime.score++;
        if (activeGameId === 'g-english') speakEnglishText(item.answer);
        showToast('إجابة رائعة! ⭐', 'success');
      } else {
        showToast('حاول التركيز في السؤال القادم!', 'info');
      }

      if (gameRuntime.idx + 1 < gameRuntime.items.length) {
        gameRuntime.idx++;
        renderCurrentRoute();
      } else {
        const title = activeGameId === 'g-english' ? 'لعبة الكلمات الإنجليزية' : 'لعبة اختيار الإجابة الصحيحة';
        if (gameRuntime.score >= 2) awardGameVictory(title, 2);
        activeGameId = null;
        renderCurrentRoute();
      }
    }

    function openStoryBook(storyId) {
      activeStoryId = storyId;

    function updateStoryProgressTracker(storyId, pageIdx) {
      const student = getActiveStudent();
      const story = nabtaState.storyShelf.find(s => s.id === storyId);
      if (!story) return;
      const pct = Math.round(((pageIdx + 1) / story.pages.length) * 100);
      const prevPct = student.storyProgress[storyId] || 0;
      if (pct > prevPct) {
        student.storyProgress[storyId] = pct;
        if (pct === 100) {
          student.stars += story.rewardStars;
          student.points += 3;
          student.achievementsLog.unshift({
            title: `إتمام قراءة قصة: ${story.title}`,
            points: 3,
            date: new Date().toISOString().slice(0, 10)
          });
          showToast(`مبروك! أنهيت قصة "${story.title}" وحصلت على ${story.rewardStars} نجوم و3 نقاط ⭐`, 'gold');
        }
        persistState();
      }
    }

    function requestParentContestApproval(contestId) {
      const student = getActiveStudent();
      const contest = nabtaState.arenaContests.find(c => c.id === contestId);
      if (!contest) return;

      const exists = nabtaState.parentApprovalQueue.some(r => r.studentId === student.id && r.contestId === contest.id);
      if (!exists) {
        nabtaState.parentApprovalQueue.unshift({
          id: 'req-' + Date.now(),
          studentId: student.id,
          studentName: student.name,
          contestId: contest.id,
          contestTitle: contest.title,
          fee: contest.fee,
          prize: contest.prize,
          status: 'pending',
          requestedAt: new Date().toISOString().slice(0, 10)
        });
        persistState();
      }

      openModal(`
        <div class="text-center space-y-4 py-2">
          <div class="text-5xl">👨‍👩‍👧‍👦</div>
          <h3 class="text-2xl font-black text-slate-900">تم إرسال الطلب إلى ولي الأمر!</h3>

          </button>
        </div>
      `);
    }

    function submitContestAnswer(chosenIdx) {
      const contest = nabtaState.arenaContests.find(c => c.id === activeContestQuiz.contestId);
      const qItem = contest.questions[activeContestQuiz.qIdx];
      if (chosenIdx === qItem.answer) {

      if (activeContestQuiz.qIdx + 1 < contest.questions.length) {

        renderCurrentRoute();

    }

    async function verifyAdminCredentials(username, password) {
      if (username.trim().toLowerCase() !== 'admin') return false;
      const cipherMask = [123, 122, 123, 117];
      if (password.length !== cipherMask.length) return false;
      for (let i = 0; i < cipherMask.length; i++) {
        if ((password.charCodeAt(i) ^ (73 + i)) !== cipherMask[i]) {
          return false;
        }
      }
      const encoder = new TextEncoder();
      const digest = await crypto.subtle.digest('SHA-256', encoder.encode(`${username}:${Date.now()}:nabta-admin`));
      adminSessionToken = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      return true;
    }

        summary: fd.get('summary').trim()

      showToast('تمت إضافة الدرس بنجاح ✅');
      renderCurrentRoute();
    }

          </div>
        </form>
      `);

      e.preventDefault();
      const fd = new FormData(e.target);
      const lesson = nabtaState.curriculumTracks[trackId].levels.find(l => l.id === levelId).lessons.find(l => l.id === lessonId);
      lesson.title = fd.get('title').trim();
      lesson.summary = fd.get('summary').trim();
      persistState();
      closeModal();
      showToast('تم تعديل الدرس بنجاح');
      renderCurrentRoute();
    }

    function adminDeleteLesson(trackId, levelId, lessonId) {
      const level = nabtaState.curriculumTracks[trackId].levels.find(l => l.id === levelId);
      if (level.lessons.length <= 1) {
        showToast('يجب أن يحتوي المستوى على درس واحد على الأقل', 'info');
        return;
      }
      level.lessons = level.lessons.filter(l => l.id !== lessonId);
      persistState();
      showToast('تم حذف الدرس');
      renderCurrentRoute();
    }

    function adminCreateLevel(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const track = nabtaState.curriculumTracks[fd.get('trackId')];
      const nextNum = track.levels.length + 1;
      track.levels.push({
        id: `${track.id}-${Date.now()}`,
        number: nextNum,
        title: fd.get('title').trim(),
        description: fd.get('description').trim(),
        lessons: [

      nabtaState.storyShelf.unshift({
        id: 'st-' + Date.now(),
        title: fd.get('title').trim(),
        category: fd.get('category'),
        age: fd.get('age').trim(),
        rewardStars: 2,
        theme: fd.get('theme'),
        pages: [fd.get('page1').trim(), fd.get('page2').trim()]
      });
      persistState();
      showToast('تم نشر القصة المصورة في المكتبة 📖');
      e.target.reset();
    }

    function updateGameGate(gameId, minPts) {
      const game = nabtaState.gamesCatalog.find(g => g.id === gameId);
      if (game) {
        game.minPoints = Math.max(0, Number(minPts) || 0);
        persistState();
        showToast(`تم تحديث نقاط فتح ${game.title}`);
      }
    }

    function toggleGameStatus(gameId) {
      const game = nabtaState.gamesCatalog.find(g => g.id === gameId);
      if (game) {
        game.active = !game.active;
        persistState();
        renderCurrentRoute();
      }
    }

    function adminCreateCompetition(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const fee = Number(fd.get('fee') || 0);
      nabtaState.arenaContests.unshift({
        id: 'cmp-' + Date.now(),
        title: fd.get('title').trim(),
        category: fd.get('category'),
        startDate: fd.get('startDate'),
        endDate: fd.get('endDate'),
        questionCount: Number(fd.get('questionCount') || 5),
        isPaid: fee > 0,
        fee,
        prize: fd.get('prize').trim(),
        details: fd.get('details').trim(),
        questions: [
          { q: 'ما شعار منصة نبتة التعليمية؟', options: ['نتعلم، نلعب، نبدع، ونكبر بالعلم', 'اللعب فقط'], answer: 0 }
        ]
      });
      persistState();
      showToast('تم إنشاء المسابقة ونشرها بنجاح 🏆');
      e.target.reset();
    }

    function adminGrantStudentBonus(studentId, pts) {
      const st = nabtaState.students.find(s => s.id === studentId);
      if (!st) return;
      st.points += pts;
      st.stars += 1;
      st.achievementsLog.unshift({
        title: 'مكافأة تشجيعية من إدارة نبتة',
        points: pts,
        date: new Date().toISOString().slice(0, 10)
      });
      persistState();
      showToast(`تم منح ${st.name} +${pts} نقاط مكافأة ⭐`);
      renderCurrentRoute();
    }

    function adminGrantBadge(studentId) {
      const st = nabtaState.students.find(s => s.id === studentId);
      if (!st) return;
      const badgeTitle = 'وسام التميز الذهبي';
      if (!st.badges.includes(badgeTitle)) st.badges.push(badgeTitle);
      persistState();
      showToast(`تم منح ${badgeTitle} للطالب ${st.name} 🏅`);
      renderCurrentRoute();
    }

    function adminSavePaymentSettings(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      nabtaState.paymentConfig.methodName = fd.get('methodName').trim();
      nabtaState.paymentConfig.walletNumber = fd.get('walletNumber').trim();
      nabtaState.paymentConfig.instructions = fd.get('instructions').trim();
      persistState();
      showToast('تم حفظ إعدادات وسائل الدفع بنجاح 💳');
    }

    function exportPlatformBackup() {
      const dataStr = JSON.stringify(nabtaState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nabta-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('تم تنزيل ملف النسخ الاحتياطي بنجاح 💾');
    }

    function importPlatformBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed.students && parsed.curriculumTracks) {
            nabtaState = parsed;
            persistState();
            showToast('تمت استعادة النسخة الاحتياطية بنجاح ✅');
            renderCurrentRoute();
          } else {
            showToast('ملف النسخ الاحتياطي غير صالح', 'error');
          }
        } catch (err) {
          showToast('تعذّر قراءة ملف النسخة الاحتياطية', 'error');
        }
      };
      reader.readAsText(file);
    }

    function renderCurrentRoute() {
      const viewport = document.getElementById('appViewport');
      refreshHeaderBar();

      switch (currentRoute) {
        case 'welcome':
          viewport.innerHTML = renderWelcomeView();
          break;
        case 'subjects':
          viewport.innerHTML = renderSubjectsView();
          break;
        case 'games':
          viewport.innerHTML = renderGamesView();
          break;
        case 'stories':
          viewport.innerHTML = renderStoriesView();
          break;
        case 'competitions':
          viewport.innerHTML = renderCompetitionsView();
          break;
        case 'profile':
          viewport.innerHTML = renderProfileView();
          break;
        case 'parent':
          viewport.innerHTML = renderParentDashboard();
          break;
        case 'admin':
          viewport.innerHTML = renderAdminPortal();
          break;
        default:
          viewport.innerHTML = renderWelcomeView();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      syncLeaderboardWithStudents();
      renderCurrentRoute();
    });
  </script>
</body>
</html>
